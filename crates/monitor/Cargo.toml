[package]
name = "monitor"
version.workspace = true
edition.workspace = true

[[bin]]
name = "monitor"
path = "src/main.rs"

[dependencies]
data.workspace = true
exchange.workspace = true
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
fastwebsockets = { version = "0.9.0", default-features = false, features = ["upgrade"] }
bytes = "1.8.0"
hyper = { version = "1", default-features = false, features = ["http1", "client"] }
hyper-util = { version = "0.1.10", default-features = false }
tokio-rustls = "0.26.4"
webpki-roots = "1.0.3"
http-body-util = "0.1.2"
