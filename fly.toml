app = "flowsurface-monitor"
primary_region = "sin"  # Singapore — closest to Railway asia-southeast1

[build]
  dockerfile = "Dockerfile"

# Background worker — no HTTP listener, no health checks needed.
[processes]
  app = "monitor"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Secrets must be set via CLI:
#   fly secrets set SUPABASE_URL="..." SUPABASE_KEY="..."
#   fly secrets set TRADIO_INTRABAR_ENABLED=true
#   fly secrets set TRADIO_INTRABAR_MODE=SHADOW_EVENT
#   fly secrets set TRADIO_INTRABAR_DETECTORS=VWAP,LIQ
#   fly secrets set LAB_ENABLED=true
#
# Non-secret env vars (safe to commit):
[env]
  SYMBOL = "BTCUSDT"
  TIMEFRAME_MIN = "5"
  RUST_BACKTRACE = "1"
