# ============================================================================
#  FUENTE ÚNICA DE VERDAD para los parámetros de estrategia (StrategyConfig).
#
#  La UI y el monitor cargan este archivo al arrancar (StrategyConfig::load()).
#  Ya NO hay umbrales hardcodeados que diverjan entre UI y monitor: edita aquí.
#
#  Capas (de menor a mayor prioridad):
#    1. impl Default en types.rs   → fallback de emergencia si este archivo falta
#    2. config/strategy.toml       → este archivo (fuente base canónica)
#    3. Mongo `deployed_params`    → override por régimen que produce la calibración
#
#  Los TTL se expresan en MINUTOS para legibilidad (se convierten a ms al cargar).
# ============================================================================

[general]
enabled                  = true     # activar el motor de estrategias
drr_enabled              = false    # DRR desactivado — sistema migrado a scalping
min_score                = 0.60     # umbral de score para emitir una señal
min_score_institutional  = 0.55     # umbral para LiqHunt / FER / SMD (señales infrecuentes, alta convicción)
max_spread_bps           = 2.0      # spread máximo aceptado (basis points)
max_vpin                 = 0.75     # VPIN máximo (flujo tóxico) antes de bloquear
min_rr                   = 2.0      # R:R mínimo para emitir señal (Subdimi: siempre 2:1 mínimo)
max_rr_m5                = 8.0      # R:R máximo alcanzable en M5 BTC (filtra targets fantasía)
default_ttl_min          = 250      # TTL por defecto de una señal (minutos)
session_filter_enabled   = true     # filtrar señales según la sesión de trading activa
htf_scoring_enabled      = true     # multiplicador HTF basado en MarketStructureContext
spoof_gate_enabled       = false    # bloquear toxic_flow_gate cuando hay spoof en dirección de la señal
cooldown_bars            = 5        # velas mínimas entre señales del mismo detector

# ============================================================================
# SCALPING — 3 estrategias de order flow M1/tick (London 07-10 UTC, NY 13-17 UTC)
# ============================================================================
[scalping]
enabled                    = false
max_spread_ticks           = 2          # máx ticks de spread para cotizar/entrar
max_vr                     = 5.0        # Volume Ratio máx — pausar si evento de volatilidad
obi_threshold_long         = 0.60       # OBI mínimo para sesgar longs (S1)
obi_threshold_short        = 0.40       # OBI máximo para sesgar shorts (S1)
min_conviction_score       = 55.0       # score mínimo para emitir señal S2/S3
max_trades_per_session     = 5          # máx trades por sesión (London o NY)
daily_loss_limit_pct       = 0.03       # stop día al 3% de pérdida
max_consecutive_losses     = 9999       # desactivado — todo es paper trading
time_stop_secs             = 120        # time-stop: cerrar posición después de 2 min
s2_dz_min                  = 1.5        # delta Z-score mínimo para señal de absorción S2
s2_vr_min                  = 2.0        # VR mínimo para confirmar volumen en S2
s3_lookback_bars           = 20         # barras de lookback para detección de swings S3
s3_min_divergence_strength = 0.30       # fuerza mínima de divergencia CVD/precio en S3
london_min_score           = 70.0       # S1 en London requiere score ≥70 (datos: <70 → avg_r=-0.21)
min_rr                     = 1.5        # R:R mínimo para emitir señal scalping

[liquidation_hunt]
min_usd            = 100000         # USD liquidado en 5 min para confirmar hunt en progreso
                                    # (era 25k — demasiado bajo, filtraba ruido normal de mercado)
cascade_threshold  = 5000000        # USD en 60s que constituye una cascada (demasiado tarde para entrar)
ttl_min            = 10             # TTL de la señal (minutos)

[funding_exhaustion]
extreme_threshold  = 0.001          # funding absoluto que dispara régimen extremo (0.10%)
top_long_min       = 0.46           # top traders long pct mínimo para FER Long
retail_long_max    = 0.58           # retail long pct máximo para FER Long
ttl_min            = 30             # TTL de la señal (minutos)

[smart_money_divergence]
short_threshold        = 0.45       # top traders long pct por debajo → smart money predominantemente short
retail_long_threshold  = 0.60       # retail long pct por encima → retail predominantemente long
min_divergence         = 0.10       # divergencia mínima (retail_long - top_long) para disparar
ttl_min                = 20         # TTL de la señal (minutos)

# ============================================================================
# RANGE BREAKOUT FLOW — detector validado en backtest 30 días M1 (n=318)
# Rango de consolidación (0.08–0.55%) + CVD acumulado + VR≥2 en breakout
# Sessions: London (08-13 UTC) + Overlap (13-17 UTC) — NewYork excluido (WR 24.7%)
# Gate microestructura: cvd_slope confirma + dz entre 0.5 y 3.0
# ============================================================================
[range_breakout]
enabled          = true
stop_pct         = 0.25   # stop en % del precio (0.25% = ~$175 en BTC $70k)
target_short_pct = 0.50   # target SHORT: 0.5% → RR 2:1
target_long_pct  = 0.45   # target LONG: 0.45% → RR 1.8:1
min_rr           = 1.5    # R:R mínimo para emitir señal

# Gates de microestructura (backtest 30d: +11pp WR al filtrar por slope)
cvd_slope_gate   = true   # slope CVD debe confirmar dirección del breakout
dz_min           = 0.5    # dz mínimo alineado (elimina breakouts sin presión)
dz_max           = 3.0    # dz máximo (extremos >3 revierten — fakeout)
obi_gate             = false  # OBI gate desactivado (pendiente validación datos reales)
obi_threshold        = 0.15   # umbral Flag 2 confluencia: |obi_l5| > threshold → flag activo (escala [-1,1])

# Sistema de confluencia v2 — shadow mode (grabar todo, subir min_confluence_score cuando haya 50+ señales)
min_confluence_score = 1      # 1 = shadow mode; subir a 3 después de calibración
cvd_slope_threshold  = 15.0   # |cvd_slope| mínimo para el flag CvdSlopeSostenido
bear_long_min_score  = 5      # Long en Bear/BearPullback requiere este score mínimo

# ============================================================================
# AMD — Accumulation · Manipulation · Distribution
# Estrategia de reversión post-spike basada en SMC.
# El detector identifica: (1) rango de consolidación, (2) spike con divergencia
# CVD/VPIN (manipulación), (3) primera barra de reversión confirmada (entry).
# Sesiones: 24/7 — el patrón ocurre en cualquier horario.
# ============================================================================
[amd_detector]
enabled = true                    # shadow mode activo — registra señales en amd_signals

# Fase de acumulación
# Sweep 4320 combos: rng_max=0.30 + acc_min=10-15 es el sweet spot (80% WR, +1.4 avgR)
accum_range_min_pct       = 0.04  # mas permisivo que antes
accum_range_max_pct       = 0.30  # rangos comprimidos dan mejor edge — no amplios
accum_min_bars            = 10    # 10 barras M1 es suficiente para consolidacion real
accum_max_bars            = 60    # timeout

# Detección del spike de manipulación
# Sweep: VR 1.5x + CVD diverge es el discriminador principal; VPIN rara vez > 0.60
manip_min_vr              = 1.5   # bajado de 2.0 — spikes de 1.5x ya tienen edge
manip_vpin_threshold      = 0.55  # bajado; pendiente calibrar con datos live

# Entry de distribución (primera barra de reversión)
# Sweep: VR entry 1.0x (cualquier VR basta); slope interno OLS no discrimina
dist_min_vr               = 1.0   # bajado de 2.5 — la barra de entry no necesita ser de alto VR
dist_cvd_slope            = 5.0   # relajado — slope OLS interno no es el mejor indicador
dist_obi_confirm          = 0.08  # relajado levemente

# Gestión del trade
stop_buffer_pct           = 0.08  # buffer por encima/debajo del spike extreme (%)
min_rr                    = 2.0   # R:R mínimo requerido para emitir señal
cooldown_bars             = 30    # bajado de 45 — el patron puede repetirse mas rapido

# Timeout de fase manipulación
max_wait_bars_after_spike = 10    # barras maximas esperando reversion antes de reset

# Gates de microestructura en el spike (DESACTIVADOS — activar tras 30+ dias de datos)
# Backtest Jun 1-5: ganadores liq=0.67, perdedores liq=1.51 → gate sugerido: 1.2
# Backtest Jun 1-5: dz>=1.5 → WR 44% avgR +0.33 → gate sugerido: 1.0–1.5
manip_liq_ratio_max  = 999.0  # 999 = desactivado; activar con: 1.5
manip_dz_spike_min   = 0.0    # 0.0 = desactivado; activar con: 1.0

# Nota: sesiones optimas = Asia + London (Short 100% WR, Long 50% WR en 14d)
# NewYork excluido — edge negativo consistente con RBF
